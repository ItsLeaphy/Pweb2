<!DOCTYPE html>
<html lang="pt-br">

  <head>
    <title>Javascript</title>
    <script>

      let pilhaLivros = [];

      function limpaCampos() {
        document.getElementById('titulo').value = '';
        document.getElementById('autor').value = '';
        document.getElementById('ano').value = '';
      }

      function adicionar() {
        // pega os valores digitados nos inputs
        const titulo = document.getElementById('titulo').value;
        const autor = document.getElementById('autor').value;
        const ano = document.getElementById('ano').value;

        pilhaLivros.push({ titulo, autor, ano });

        // limpa os campos e atualiza a lista
        limpaCampos();
        mostrarLista();
      }

      function mostrarLista() {
        const container = document.getElementById('minhaDiv');
        container.innerHTML = '';

        for (let i = 0; i < pilhaLivros.length; i++) {
          const livro = pilhaLivros[i];
          const tag = '<h5>' + i + ' - Título: ' + livro.titulo + ' | Autor: ' + livro.autor + ' | Ano: ' + livro.ano + '</h5>';
          container.innerHTML += tag;
        }
      }

      function posicao() {
        const indice = Number(prompt('Qual posição da lista deseja consultar?'));

        if (indice < 0 || indice >= pilhaLivros.length) {
          alert('Posição inválida!');
          return;
        }

        const livro = pilhaLivros[indice];
        alert('Na posição ' + indice + ' está: Título: ' + livro.titulo + ' - Autor: ' + livro.autor + ' - Ano: ' + livro.ano);
      }

      function remover() {
        if (pilhaLivros.length === 0) {
          alert('A pilha está vazia!');
        } else {
          const removido = pilhaLivros.pop();
          alert('Removido: ' + removido.titulo + ' - ' + removido.autor);
          mostrarLista();
        }
      }

      function limparLista() {
        if (pilhaLivros.length === 0) {
          alert('Lista vazia!');
          return;
        }

        pilhaLivros = [];
        mostrarLista();
      }

      function inverter() {
        if (pilhaLivros.length === 0) {
          alert('Lista vazia!');
          return;
        }

        pilhaLivros.reverse();
        mostrarLista();
      }

      // DESAFIO: inserir um livro em uma posição específica usando splice
      function inserirNaPosicao() {
        if (pilhaLivros.length === 0) {
          alert('Lista vazia! Adicione um livro primeiro para ter uma posição de referência.');
          return;
        }

        const indice = Number(prompt('Em qual posição deseja inserir o livro?'));

        if (isNaN(indice) || indice < 0 || indice > pilhaLivros.length) {
          alert('Posição inválida!');
          return;
        }

        const titulo = prompt('Digite o título do livro:');
        const autor = prompt('Digite o nome do autor:');
        const ano = prompt('Digite o ano de publicação:');

        pilhaLivros.splice(indice, 0, { titulo, autor, ano });

        mostrarLista();
      }

    </script>
  </head>

  <body>

    <h1>Lista de Livros</h1>

    <label>Título:</label>
    <input type="text" id="titulo" placeholder="Digite o título do livro">

    <label>Autor:</label>
    <input type="text" id="autor" placeholder="Digite o nome do autor">

    <label>Ano:</label>
    <input type="text" id="ano" placeholder="Digite o ano de publicação">

    <button onclick="adicionar()">Adicionar</button>

    <br><br>

    <button onclick="posicao()">Posição</button>

    <button onclick="remover()">Remover Último</button>

    <button onclick="limparLista()">Limpar Lista</button>

    <button onclick="inverter()">Inverter</button>

    <button onclick="inserirNaPosicao()">Inserir na Posição</button>

    <br><br>

    <div id="minhaDiv"></div>

  </body>
</html>
