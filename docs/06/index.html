<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <title>Cadastro de Cursos</title>

  <script>

    let pilhaCursos = [];
    let indiceEdicao = null;

    function salvar() {
      const nome = document.getElementById('nome').value.trim();
      const regime = document.getElementById('regime').value;
      const cargaHoraria = document.getElementById('cargaHoraria').value.trim();

      if (nome === '' || regime === '' || cargaHoraria === '') {
        alert('Preencha todos os campos!');
        return;
      }

      if (indiceEdicao === null) {
        pilhaCursos.push({ nome, regime, cargaHoraria });
      } else {
        pilhaCursos[indiceEdicao] = { nome, regime, cargaHoraria };
        indiceEdicao = null;
      }

      document.getElementById('nome').value = '';
      document.getElementById('regime').value = '';
      document.getElementById('cargaHoraria').value = '';
      mostrarLista();
    }

    function editarCurso(indice) {
      const curso = pilhaCursos[indice];
      document.getElementById('nome').value = curso.nome;
      document.getElementById('regime').value = curso.regime;
      document.getElementById('cargaHoraria').value = curso.cargaHoraria;
      indiceEdicao = indice;
    }

    function removerCurso(indice) {
      pilhaCursos.splice(indice, 1);
      mostrarLista();
    }

    function mostrarLista() {
      const corpo = document.getElementById('tabelaCorpo');
      corpo.innerHTML = '';

      for (let i = 0; i < pilhaCursos.length; i++) {
        const curso = pilhaCursos[i];
        const linha =
          "<tr>" +
            "<td>" + i + "</td>" +
            "<td>" + curso.nome + "</td>" +
            "<td>" + curso.regime + "</td>" +
            "<td>" + curso.cargaHoraria + " h</td>" +
            "<td>" +
              "<div class='d-flex gap-2'>" +
                "<button class='btn btn-secondary' onclick='editarCurso(" + i + ")'>Editar</button>" +
                "<button class='btn btn-danger' onclick='removerCurso(" + i + ")'>Remover</button>" +
              "</div>" +
            "</td>" +
          "</tr>";
        corpo.innerHTML += linha;
      }
    }

    function remover() {
      if (pilhaCursos.length === 0) {
        alert('A pilha está vazia!');
      } else {
        const removido = pilhaCursos.pop();
        alert('Removido: ' + removido.nome);
        mostrarLista();
      }
    }

    function limparLista() {
      if (pilhaCursos.length === 0) {
        alert('Lista vazia!');
        return;
      }
      pilhaCursos = [];
      mostrarLista();
    }

    function inverterPilha() {
      if (pilhaCursos.length === 0) {
        alert('Lista vazia!');
        return;
      }
      pilhaCursos.reverse();
      mostrarLista();
    }

  </script>
</head>

<body class="container py-4">

  <h1 class="mb-4">Cadastro de Cursos</h1>

  <div class="card p-4 shadow-sm">
    <div class="row g-3">

      <div class="col-md-5">
        <label class="form-label">Nome do Curso</label>
        <input type="text" id="nome" class="form-control" placeholder="Ex: Informática, Enfermagem, etc.">
      </div>

      <div class="col-md-3">
        <label class="form-label">Regime</label>
        <select id="regime" class="form-control">
          <option value="">Selecione...</option>
          <option value="Superior">Superior</option>
          <option value="Médio">Médio</option>
          <option value="Técnico">Técnico</option>
        </select>
      </div>

      <div class="col-md-3">
        <label class="form-label">Carga Horária (h)</label>
        <input type="number" id="cargaHoraria" class="form-control" placeholder="Ex: 1200">
      </div>

    </div>

    <div class="mt-3 d-flex gap-2">
      <button class="btn btn-secondary" onclick="salvar()">Salvar</button>
    </div>
  </div>

  <hr>

  <div class="mb-3 d-flex gap-2">
    <button class="btn btn-danger" onclick="remover()">Remover Último</button>
    <button class="btn btn-danger" onclick="limparLista()">Limpar Lista</button>
    <button class="btn btn-secondary" onclick="inverterPilha()">Inverter</button>
  </div>

  <div id="minhaDiv">
    <table class="table table-bordered table-striped align-middle shadow-sm">
      <thead class="table-dark">
        <tr>
          <th>#</th>
          <th>Nome</th>
          <th>Regime</th>
          <th>Carga Horária</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody id="tabelaCorpo">
        <!-- Linhas serão inseridas aqui -->
      </tbody>
    </table>
  </div>

</body>
</html>
