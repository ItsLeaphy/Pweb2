<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 02 - JavaScript</title>

    <style>
  button {
    margin-bottom: 12px;}
    </style>

    <script>
        function raizQuadrada(numero){
            var raiz = Math.sqrt(numero);
            alert("A raiz quadrada de " + numero + " é " + raiz);
        }
    </script>

    <script>
        function escreveDiv(texto){
            document.getElementById("minhaDiv").innerHTML = texto;
        }
    </script>

    <script>
        function escreveDiv2(){
            var texto = prompt('Digite um texto qualquer');
            document.getElementById("minhaDiv2").innerHTML = texto;
        }
    </script>

    <script>
        function contarAteN(){
            var n = prompt("Digite até qual número deseja contar:");
            n = parseInt(n);

            if (isNaN(n) || n <= 0) {
                alert("Por favor, insira um número válido maior que zero.");
                return;
            }

            var saida = "";
            for(var i = 1; i <= n; i++){
                saida = saida + i + "<br>";
            }

            document.getElementById("minhaDiv3").innerHTML = saida;
        }
    </script>

    <script>
        function escreverNumerosInput() {
            var input = document.getElementById("numeroInput");
            var n = parseInt(input.value);

            if (isNaN(n) || n <= 0) {
                alert("Por favor, insira um número válido maior que zero.");
                return;
            }

            var div = document.getElementById("numerosInput");
            div.innerHTML = "";
            for (var i = 1; i <= n; i++) {
                div.innerHTML += i + "<br>";
            }
        }
    </script>

</head>
<body>

    <h1>Atividade 02 - Exercícios JavaScript</h1>

    <hr>
    <h2>Exercício 1 - Raiz Quadrada</h2>
    <button onclick="raizQuadrada(25)">Raiz de 25</button><br>
    <button onclick="raizQuadrada(36)">Raiz de 36</button><br>
    <button onclick="raizQuadrada(49)">Raiz de 49</button>

    <hr>
    <h2>Exercício 2 - Escrevendo em uma div</h2>
    <button onclick="escreveDiv('Oi, escrevi na div!')">Escrever</button>
    <div id="minhaDiv"></div>

    <hr>
    <h2>Exercício 3 - Texto dinâmico</h2>
    <button onclick="escreveDiv2()">Escrever</button>
    <div id="minhaDiv2"></div>

    <hr>
    <h2>Desafio - Contar de 1 a n</h2>
    <button onclick="contarAteN()">Gerar</button>
    <div id="minhaDiv3"></div>

    <hr>

    <h1>Desafio com Input</h1>
    <label for="numeroInput">Digite o valor de N:</label>
    <input type="number" id="numeroInput" placeholder="Digite um número" min="1">
    <button onclick="escreverNumerosInput()">Escrever Números</button>

    <br><br>

    <div id="numerosInput"></div>

</body>
</html>
